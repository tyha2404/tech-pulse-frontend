<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f5f8" />
    <meta
      name="description"
      content="Tự động cào, tổng hợp và phân tích tin tức chuyên sâu cho Backend & AI Engineers"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TechPulse" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('techpulse-theme') || 'system';
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101923' : '#f2f5f8';
      })();
    </script>
    <title>TechPulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
